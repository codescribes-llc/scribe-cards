<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Scribe Cards - Certification Flashcards</title>
    <meta name="description" content="Flashcards grounded in hand-written certification study notes: Claude API, Agent Skills, GitHub Actions and Ansible." />

    <!--
      Link previews (Slack, LinkedIn, X). Their crawlers read this HTML and never run the
      app, so each route needs these in its own file. `scripts/write-route-pages.ts`
      rewrites the title, description and URL lines per route after the build, which is why
      each tag stays on one line. Image URLs must be absolute.
    -->
    <link rel="canonical" href="https://flashcards.codescribes.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Scribe Cards" />
    <meta property="og:title" content="Scribe Cards - Certification Flashcards" />
    <meta property="og:description" content="Flashcards grounded in hand-written certification study notes: Claude API, Agent Skills, GitHub Actions and Ansible." />
    <meta property="og:url" content="https://flashcards.codescribes.io/" />
    <meta property="og:image" content="https://flashcards.codescribes.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Scribe Cards - certification flashcards grounded in hand-written study notes" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Scribe Cards - Certification Flashcards" />
    <meta name="twitter:description" content="Flashcards grounded in hand-written certification study notes: Claude API, Agent Skills, GitHub Actions and Ansible." />
    <meta name="twitter:image" content="https://flashcards.codescribes.io/og-image.png" />
    <meta name="theme-color" content="#1B8996" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090B" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Abel&family=Bellefair&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the stored theme before first paint so dark mode never flashes white.
      // Mirrors the toggle logic in the style guide §9 (class strategy, not media).
      try {
        var saved = localStorage.getItem('scribe-cards.theme')
        if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (_) {
        /* localStorage unavailable (private mode) - fall back to light */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
